# 环境：test 使用 UserId Header 鉴权；其它环境使用 JWT
env: test

server:
  http_addr: ":8080"

database:
  filename: mall.db

logger:
  filename: ""

auth:
  jwt_secret: "mall-dev-secret-change-me"
  # token 有效期（小时）
  jwt_expire_hours: 168

order:
  # 待支付超时（秒）
  pay_timeout_sec: 900

point:
  # 1 元 = N 积分（可变，下单时快照）
  points_per_yuan: 100

# 商城展示信息（H5「我的」帮助中心 / 关于我们 / 联系方式）
mall:
  contact:
    phone: "400-800-1234"
    email: "support@mall.example"
    wechat: "mall_support"
    address: "上海市浦东新区示例路 88 号"
  help_center: |
    【下单与支付】
    1. 加入购物车后可勾选商品下单。
    2. 支持 Mock 支付（测试）与积分抵扣。
    3. 待支付订单请在有效期内完成支付，超时将自动取消并回库存。

    【积分说明】
    1. 积分可用于商品订单抵扣，汇率以订单快照为准。
    2. 可在「我的-积分」中购买积分充值。
    3. 积分充值订单不可再用积分支付。

    【售后与账号】
    如遇问题请通过「联系我们」中的方式联系客服。
  about_us: |
    Mall 是一个示例商城项目，提供商品浏览、购物车、订单与积分能力。
    我们致力于提供清晰、可联调的前后端一体演示体验。

# 启动时幂等写入的管理员账号（按 username，已存在则跳过创建）
admins:
  - username: admin
    password: admin123
    nickname: 管理员
