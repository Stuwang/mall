syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "base/base.proto";

option go_package = "mall/user/api/user;user";

// 用户管理服务
service User {
  // 用户注册
  rpc Register (RegisterRequest) returns (RegisterReply) {
    option (google.api.http) = {
      post: "/user/api/v1/register"
      body: "*"
    };
  }

  // 用户登录
  rpc Login (LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/user/api/v1/login"
      body: "*"
    };
  }

  // 续签：凭当前仍有效的 access token 换发新 token，过期时间从当前时刻重算
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenReply) {
    option (google.api.http) = {
      post: "/user/api/v1/token/refresh"
      body: "*"
    };
  }

  // 用户信息查询
  rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoReply) {
    option (google.api.http) = {
      post: "/user/api/v1/info"
      body: "*"
    };
  }

  // 用户信息修改
  rpc UpdateUserInfo (UpdateUserInfoRequest) returns (UpdateUserInfoReply) {
    option (google.api.http) = {
      post: "/user/api/v1/update"
      body: "*"
    };
  }
}

// 管理侧用户服务（需 admin）
service AdminUser {
  // 用户查询（支持按 id / 关键词）
  rpc AdminListUsers (AdminListUsersRequest) returns (AdminListUsersReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/user/list"
      body: "*"
    };
  }

  // 用户详情
  rpc AdminGetUser (AdminGetUserRequest) returns (GetUserInfoReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/user/detail"
      body: "*"
    };
  }

  // 封禁用户到指定时间；ban_until=0 表示解封
  rpc AdminBanUser (AdminBanUserRequest) returns (GetUserInfoReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/user/ban"
      body: "*"
    };
  }
}

// 用户信息
message UserInfo {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  int32 sex = 4;
  int64 ct = 5;
  int64 ut = 6;
  bool is_admin = 7;
  // 封禁截止时间戳；0=未封禁
  int64 ban_until = 8;
  // 当前是否处于封禁中
  bool banned = 9;
  // 头像可访问 URL（库内为逻辑 URI，出站已 Resolve）
  string avatar = 10;
}

message RegisterRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  string username = 2;
  string password = 3;
  string nickname = 4;
}

message RegisterReply {
  UserInfo user = 1;
}

message LoginRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  string username = 2;
  string password = 3;
}

message LoginReply {
  UserInfo user = 1;
  string access_token = 2;
}

message RefreshTokenRequest {
  helloworld.v1.BaseParam BaseParam = 1;
}

message RefreshTokenReply {
  string access_token = 1;
}

message GetUserInfoRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
}

message GetUserInfoReply {
  UserInfo user = 1;
}

message UpdateUserInfoRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
  string nickname = 3;
  int32 sex = 4;
  // 头像逻辑 URI 或 /files/ 路径；空表示不改头像
  string avatar = 5;
}

message UpdateUserInfoReply {
  UserInfo user = 1;
}

message AdminListUsersRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  // 按用户 id 精确查；0=不限
  int64 user_id = 2;
  // 匹配昵称或登录账号
  string keyword = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message AdminListUsersReply {
  repeated UserInfo list = 1;
  int64 total = 2;
}

message AdminGetUserRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 user_id = 2;
}

message AdminBanUserRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 user_id = 2;
  // 封禁截止 unix 时间戳；传 0 解封；须大于当前时间
  int64 ban_until = 3;
}
