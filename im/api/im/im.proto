syntax = "proto3";

package im.v1;

import "base/base.proto";
import "common/common.proto";
import "google/api/annotations.proto";

option go_package = "mall/im/api/im;im";

// 用户侧一对一聊天。身份从鉴权取，不读 BaseParam。
service Im {
  rpc OpenConv (OpenConvRequest) returns (Conversation) {
    option (google.api.http) = {
      post: "/im/api/v1/conv/open"
      body: "*"
    };
  }

  rpc ListConv (ListConvRequest) returns (ListConvReply) {
    option (google.api.http) = {
      post: "/im/api/v1/conv/list"
      body: "*"
    };
  }

  rpc History (HistoryRequest) returns (HistoryReply) {
    option (google.api.http) = {
      post: "/im/api/v1/msg/history"
      body: "*"
    };
  }

  rpc Send (SendRequest) returns (Msg) {
    option (google.api.http) = {
      post: "/im/api/v1/msg/send"
      body: "*"
    };
  }
}

// 内部代发。不使用用户 JWT，校验 X-Im-System-Token。
service ImInternal {
  rpc Send (InternalSendRequest) returns (InternalSendReply) {
    option (google.api.http) = {
      post: "/im/internal/v1/msg/send"
      body: "*"
    };
  }

  // 更新已有消息。同步序号 seq 会改成新值，视图序号不变。
  rpc Update (InternalUpdateRequest) returns (InternalSendReply) {
    option (google.api.http) = {
      post: "/im/internal/v1/msg/update"
      body: "*"
    };
  }
}

message Peer {
  int64 user_id = 1;
  string nickname = 2;
}

message MsgContent {
  string text = 1;
}

// 下行消息。seq 是同步序号，view_seq 是当前用户的视图序号。
message Msg {
  int64 msg_id = 1;
  int64 seq = 2;
  int64 view_seq = 3;
  int64 sender_id = 4;
  im.common.v1.Origin origin = 5;
  string client_msg_id = 6;
  im.common.v1.ContentType content_type = 7;
  MsgContent content = 8;
  int64 ct = 9;
}

message MsgPreview {
  int64 msg_id = 1;
  int64 view_seq = 2;
  int64 sender_id = 3;
  im.common.v1.Origin origin = 4;
  im.common.v1.ContentType content_type = 5;
  string preview = 6;
  int64 ct = 7;
}

message Conversation {
  Peer peer = 1;
  int64 last_seq = 2;
  int64 last_sync_seq = 3;
  MsgPreview last_msg = 4;
  int64 last_msg_at = 5;
}

message OpenConvRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 peer_user_id = 2;
}

message ListConvRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListConvReply {
  repeated Conversation list = 1;
  int64 total = 2;
}

message HistoryRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 peer_user_id = 2;
  // 视图序号游标。direction=1 时 0 表示从最新往前；direction=2 时表示取 view_seq 更大的消息。
  int64 cursor_seq = 3;
  // 1 向更早，2 向更新
  int32 direction = 4;
  int32 limit = 5;
}

message HistoryReply {
  repeated Msg list = 1;
  int64 last_seq = 2;
  int64 last_sync_seq = 3;
  bool has_more = 4;
}

message SendRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 peer_user_id = 2;
  string client_msg_id = 3;
  im.common.v1.ContentType content_type = 4;
  string text = 5;
}

message InternalSendRequest {
  int64 sender_id = 1;
  int64 peer_user_id = 2;
  // 1 仅对方可见，2 仅发送者可见，3 双方可见
  im.common.v1.Visibility visibility = 3;
  // 是否更新名义发送者的会话列表预览
  bool sender_preview = 4;
  // 是否更新对端的会话列表预览
  bool peer_preview = 5;
  string request_id = 6;
  im.common.v1.ContentType content_type = 7;
  string text = 8;
}

message InternalUpdateRequest {
  int64 msg_id = 1;
  im.common.v1.ContentType content_type = 2;
  string text = 3;
  bool sender_preview = 4;
  bool peer_preview = 5;
}

message InternalSendReply {
  int64 msg_id = 1;
  // 同步序号。更新消息后这是新值。
  int64 seq = 2;
  // 名义发送者的视图序号。不可见时为 0。更新消息时不变。
  int64 sender_view_seq = 3;
  // 对端的视图序号。不可见时为 0。
  int64 peer_view_seq = 4;
}
