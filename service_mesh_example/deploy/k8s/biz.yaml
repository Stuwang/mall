apiVersion: apps/v1
kind: Deployment
metadata:
  name: biz-a
  namespace: mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biz-a
  template:
    metadata:
      labels:
        app: biz-a
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "false"
        consul.hashicorp.com/connect-service: "biz-a"
        consul.hashicorp.com/connect-service-port: "8000"
        consul.hashicorp.com/connect-service-protocol: "http"
    spec:
      containers:
        - name: biz
          image: docker.io/library/mesh-biz:local
          imagePullPolicy: Never
          env:
            - name: SERVICE_NAME
              value: biz-a
            - name: HTTP_ADDR
              value: "127.0.0.1:8000"
            - name: HEALTH_ADDR
              value: ":8081"
            - name: GATEWAY_ADDR
              valueFrom:
                configMapKeyRef:
                  name: mesh-peers
                  key: GATEWAY_ADDR
          ports:
            - name: http
              containerPort: 8000
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: biz-a
  namespace: mesh
spec:
  type: ClusterIP
  selector:
    app: biz-a
  ports:
    - name: http
      port: 8000
      targetPort: http
---
