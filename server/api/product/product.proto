syntax = "proto3";

package product.v1;

import "google/api/annotations.proto";
import "base/base.proto";

option go_package = "helloworld/api/product;product";

// 用户侧商品服务
service Product {
  // 商品浏览（仅上架）
  rpc ListProducts (ListProductsRequest) returns (ListProductsReply) {
    option (google.api.http) = {
      post: "/product/api/v1/list"
      body: "*"
    };
  }

  // 商品详情（仅上架）
  rpc GetProduct (GetProductRequest) returns (GetProductReply) {
    option (google.api.http) = {
      post: "/product/api/v1/detail"
      body: "*"
    };
  }

  // 按分类浏览商品（仅上架）
  rpc ListProductsByCategory (ListProductsByCategoryRequest) returns (ListProductsReply) {
    option (google.api.http) = {
      post: "/product/api/v1/list_by_category"
      body: "*"
    };
  }

  // 分类列表（启用中的）
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesReply) {
    option (google.api.http) = {
      post: "/product/api/v1/category/list"
      body: "*"
    };
  }
}

// 管理侧商品/分类服务（需 admin）
service AdminProduct {
  // ----- 分类 -----
  rpc AdminCreateCategory (AdminCreateCategoryRequest) returns (AdminCategoryReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/category/create"
      body: "*"
    };
  }
  rpc AdminUpdateCategory (AdminUpdateCategoryRequest) returns (AdminCategoryReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/category/update"
      body: "*"
    };
  }
  rpc AdminListCategories (AdminListCategoriesRequest) returns (ListCategoriesReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/category/list"
      body: "*"
    };
  }

  // ----- 商品 -----
  rpc AdminCreateProduct (AdminCreateProductRequest) returns (AdminProductReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/product/create"
      body: "*"
    };
  }
  rpc AdminUpdateProduct (AdminUpdateProductRequest) returns (AdminProductReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/product/update"
      body: "*"
    };
  }
  rpc AdminSetProductStatus (AdminSetProductStatusRequest) returns (AdminProductReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/product/set_status"
      body: "*"
    };
  }
  rpc AdminUpdateProductStock (AdminUpdateProductStockRequest) returns (AdminProductReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/product/update_stock"
      body: "*"
    };
  }
  rpc AdminUpdateProductCategory (AdminUpdateProductCategoryRequest) returns (AdminProductReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/product/update_category"
      body: "*"
    };
  }
  rpc AdminListProducts (AdminListProductsRequest) returns (ListProductsReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/product/list"
      body: "*"
    };
  }
  rpc AdminGetProduct (AdminGetProductRequest) returns (GetProductReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/product/detail"
      body: "*"
    };
  }
}

// 商品状态
enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_ON = 1;  // 上架
  PRODUCT_STATUS_OFF = 2; // 下架
}

// 分类状态
enum CategoryStatus {
  CATEGORY_STATUS_UNSPECIFIED = 0;
  CATEGORY_STATUS_ON = 1;
  CATEGORY_STATUS_OFF = 2;
}

message CategoryInfo {
  int64 id = 1;
  string name = 2;
  int32 sort = 3;
  CategoryStatus status = 4;
  int64 ct = 5;
  int64 ut = 6;
}

message ProductInfo {
  int64 id = 1;
  int64 category_id = 2;
  string name = 3;
  string description = 4;
  // 价格，单位分
  int64 price = 5;
  int32 stock = 6;
  ProductStatus status = 7;
  // 商品图片列表（按顺序）
  repeated string images = 8;
  int64 ct = 9;
  int64 ut = 10;
}

message ListProductsRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int32 page = 2;
  int32 page_size = 3;
  string keyword = 4;
}

message ListProductsByCategoryRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 category_id = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListProductsReply {
  repeated ProductInfo list = 1;
  int64 total = 2;
}

message GetProductRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
}

message GetProductReply {
  ProductInfo product = 1;
}

message ListCategoriesRequest {
  helloworld.v1.BaseParam BaseParam = 1;
}

message ListCategoriesReply {
  repeated CategoryInfo list = 1;
}

message AdminCreateCategoryRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  string name = 2;
  int32 sort = 3;
  CategoryStatus status = 4;
}

message AdminUpdateCategoryRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
  string name = 3;
  int32 sort = 4;
  CategoryStatus status = 5;
}

message AdminListCategoriesRequest {
  helloworld.v1.BaseParam BaseParam = 1;
}

message AdminCategoryReply {
  CategoryInfo category = 1;
}

message AdminCreateProductRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 category_id = 2;
  string name = 3;
  string description = 4;
  int64 price = 5;
  int32 stock = 6;
  repeated string images = 7;
  ProductStatus status = 8;
}

message AdminUpdateProductRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
  string name = 3;
  string description = 4;
  int64 price = 5;
  repeated string images = 6;
}

message AdminSetProductStatusRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
  ProductStatus status = 3;
}

message AdminUpdateProductStockRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
  int32 stock = 3;
}

message AdminUpdateProductCategoryRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
  int64 category_id = 3;
}

message AdminListProductsRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 category_id = 4;
  ProductStatus status = 5;
  string keyword = 6;
}

message AdminGetProductRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 id = 2;
}

message AdminProductReply {
  ProductInfo product = 1;
}
