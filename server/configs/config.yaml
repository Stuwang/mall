# 环境：test 使用 UserId Header 鉴权；其它环境使用 JWT
env: test

server:
  http_addr: ":8080"

database:
  filename: mall.db

logger:
  filename: ""

auth:
  jwt_secret: "mall-dev-secret-change-me"
  # token 有效期（小时）
  jwt_expire_hours: 168

order:
  # 待支付超时（秒）
  pay_timeout_sec: 900

point:
  # 1 元 = N 积分（可变，下单时快照）
  points_per_yuan: 100

# 启动时幂等写入的管理员账号（按 username，已存在则跳过创建）
admins:
  - username: admin
    password: admin123
    nickname: 管理员
