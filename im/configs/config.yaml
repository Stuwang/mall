# 环境：test 使用 UserId Header 鉴权；其它环境使用 JWT（web 客户端走 JWT）
env: dev

server:
  http_addr: ":8090"

database:
  filename: im.db

logger:
  filename: ""

auth:
  jwt_secret: "im-dev-secret-change-me"
  jwt_expire_hours: 168

im:
  system_token: "im-dev-system-token"
  heartbeat_sec: 25
  idle_sec: 70
  max_conns_per_user: 5
  text_max_runes: 2000

# 头像存储（库内存 local_file:///key，对外 PathURL 为 /files/key）
storage:
  public_base: "http://192.168.96.132:8090"
  max_upload_bytes: 100000000
  local:
    root_dir: "data/images"
