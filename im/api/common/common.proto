syntax = "proto3";

package im.common.v1;

option go_package = "mall/im/api/common;common";

// 消息来源
enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_USER = 1;
  ORIGIN_SYSTEM = 2;
}

// 谁能看见这条消息
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PEER_ONLY = 1;
  VISIBILITY_SENDER_ONLY = 2;
  VISIBILITY_BOTH = 3;
}

// 消息正文类型。
enum ContentType {
  CONTENT_TYPE_UNSPECIFIED = 0;
  CONTENT_TYPE_TEXT = 1;
  CONTENT_TYPE_IMAGE = 2;
  CONTENT_TYPE_GIFT = 3;
}

// 支付渠道。微信、支付宝未接入。
enum PayType {
  PAY_TYPE_UNSPECIFIED = 0;
  PAY_TYPE_WECHAT = 1;
  PAY_TYPE_ALIPAY = 2;
  PAY_TYPE_MOCK = 3;
}

// 金币充值订单状态。
enum CoinOrderStatus {
  COIN_ORDER_STATUS_UNSPECIFIED = 0;
  COIN_ORDER_STATUS_PENDING_PAY = 1;
  COIN_ORDER_STATUS_PAID = 2;
  COIN_ORDER_STATUS_CANCELLED = 3;
}

// 金币流水类型。
enum CoinChangeType {
  COIN_CHANGE_TYPE_UNSPECIFIED = 0;
  COIN_CHANGE_TYPE_RECHARGE = 1;
  COIN_CHANGE_TYPE_GIFT_SEND = 2;
}
