---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: kratos
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: api.app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: http-server
                port:
                  number: 80
