syntax = "proto3";

package asset.v1;

import "google/api/annotations.proto";
import "base/base.proto";

option go_package = "helloworld/api/asset;asset";

// 用户资产服务
service Asset {
  // 查询当前用户资产列表
  rpc GetUserAssets (GetUserAssetsRequest) returns (GetUserAssetsReply) {
    option (google.api.http) = {
      post: "/asset/api/v1/list"
      body: "*"
    };
  }

  // 查询当前用户资产变更历史
  rpc GetAssetHistory (GetAssetHistoryRequest) returns (GetAssetHistoryReply) {
    option (google.api.http) = {
      post: "/asset/api/v1/history"
      body: "*"
    };
  }
}

// 管理侧资产服务（需 admin）
service AdminAsset {
  // 查询指定用户资产列表
  rpc AdminGetUserAssets (AdminGetUserAssetsRequest) returns (GetUserAssetsReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/asset/list"
      body: "*"
    };
  }

  // 后台手动给用户增加积分
  rpc AdminGrantPoints (AdminGrantPointsRequest) returns (AdminGrantPointsReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/asset/grant_points"
      body: "*"
    };
  }

  // 查询指定用户资产变更历史
  rpc AdminGetAssetHistory (AdminGetAssetHistoryRequest) returns (GetAssetHistoryReply) {
    option (google.api.http) = {
      post: "/admin/api/v1/asset/history"
      body: "*"
    };
  }
}

// 资产类型
enum AssetType {
  ASSET_TYPE_UNSPECIFIED = 0;
  // 积分
  ASSET_TYPE_POINT = 1;
}

message AssetInfo {
  int64 user_id = 1;
  AssetType type = 2;
  int64 balance = 3;
  int64 ct = 4;
  int64 ut = 5;
}

message AssetHistory {
  int64 id = 1;
  int64 user_id = 2;
  AssetType type = 3;
  // 变更量（可正可负）
  int64 change = 4;
  // 变更后余额
  int64 balance = 5;
  // 幂等 ID
  string idempotent_id = 6;
  string biz_type = 7;
  string biz_id = 8;
  string remark = 9;
  int64 ct = 10;
}

message GetUserAssetsRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  // 可选：按类型筛选，0 表示全部
  AssetType type = 2;
}

message GetUserAssetsReply {
  repeated AssetInfo assets = 1;
}

message GetAssetHistoryRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  // 可选：按类型筛选，0 表示全部
  AssetType type = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetAssetHistoryReply {
  repeated AssetHistory list = 1;
  int64 total = 2;
}

message AdminGetUserAssetsRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 user_id = 2;
  // 可选：按类型筛选，0 表示全部
  AssetType type = 3;
}

message AdminGetAssetHistoryRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 user_id = 2;
  AssetType type = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message AdminGrantPointsRequest {
  helloworld.v1.BaseParam BaseParam = 1;
  int64 user_id = 2;
  // 增加的积分数，必须 > 0
  int64 points = 3;
  // 备注（可选）
  string remark = 4;
}

message AdminGrantPointsReply {
  AssetInfo asset = 1;
}
