# 业务端口只监听 127.0.0.1，网格外和 ClusterIP 都进不去。
# 南北向 mesh-ingress 访问 biz，东西向 mesh-eastwest 访问 svc。二者身份分开。
# ACL 目前关闭，下面的 intention 先写成网关放行，打开 ACL 后仍然适用。
apiVersion: consul.hashicorp.com/v1alpha1
kind: Mesh
metadata:
  name: mesh
  namespace: mesh
spec:
  allowEnablingPermissiveMutualTLS: true
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: biz-a
  namespace: mesh
spec:
  protocol: http
  mutualTLSMode: permissive
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: biz-b
  namespace: mesh
spec:
  protocol: http
  mutualTLSMode: permissive
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: biz-c
  namespace: mesh
spec:
  protocol: http
  mutualTLSMode: permissive
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: svc-a
  namespace: mesh
spec:
  protocol: grpc
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: svc-b
  namespace: mesh
spec:
  protocol: grpc
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceDefaults
metadata:
  name: svc-c
  namespace: mesh
spec:
  protocol: grpc
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: svc-a
  namespace: mesh
spec:
  destination:
    name: svc-a
  sources:
    - name: mesh-eastwest
      action: allow
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: svc-b
  namespace: mesh
spec:
  destination:
    name: svc-b
  sources:
    - name: mesh-eastwest
      action: allow
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: svc-c
  namespace: mesh
spec:
  destination:
    name: svc-c
  sources:
    - name: mesh-eastwest
      action: allow
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: biz-a
  namespace: mesh
spec:
  destination:
    name: biz-a
  sources:
    - name: mesh-ingress
      action: allow
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: biz-b
  namespace: mesh
spec:
  destination:
    name: biz-b
  sources:
    - name: mesh-ingress
      action: allow
---
apiVersion: consul.hashicorp.com/v1alpha1
kind: ServiceIntentions
metadata:
  name: biz-c
  namespace: mesh
spec:
  destination:
    name: biz-c
  sources:
    - name: mesh-ingress
      action: allow
