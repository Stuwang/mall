syntax = "proto3";

package mesh.biz.v1;

import "google/api/annotations.proto";

option go_package = "mall/service_mesh_example/api/biz/v1;bizv1";

// BizA 的 HTTP 路径以 /biz_a 开头。三个 biz 共用消息，只是路径和服务名不同。
service BizA {
  rpc Ping(PingRequest) returns (PingReply) {
    option (google.api.http) = {
      get: "/biz_a/ping"
    };
  }
  rpc Call(CallRequest) returns (CallReply) {
    option (google.api.http) = {
      get: "/biz_a/call"
      additional_bindings {
        post: "/biz_a/call"
        body: "*"
      }
    };
  }
}

service BizB {
  rpc Ping(PingRequest) returns (PingReply) {
    option (google.api.http) = {
      get: "/biz_b/ping"
    };
  }
  rpc Call(CallRequest) returns (CallReply) {
    option (google.api.http) = {
      get: "/biz_b/call"
      additional_bindings {
        post: "/biz_b/call"
        body: "*"
      }
    };
  }
}

service BizC {
  rpc Ping(PingRequest) returns (PingReply) {
    option (google.api.http) = {
      get: "/biz_c/ping"
    };
  }
  rpc Call(CallRequest) returns (CallReply) {
    option (google.api.http) = {
      get: "/biz_c/call"
      additional_bindings {
        post: "/biz_c/call"
        body: "*"
      }
    };
  }
}

message PingRequest {}

message PingReply {
  string service = 1;
}

message CallRequest {
  // trace 由调用方带上，服务把自己的名字追加在后面。
  string trace = 1;
  // targets 为空时调用全部 svc。逗号分隔和重复字段都可以。
  repeated string targets = 2;
  // depth 为 1 时 svc 只应答自己；大于 1 时 svc 再去调其他 svc。
  int32 depth = 3;
}

message CallReply {
  string service = 1;
  string trace = 2;
  repeated Hop hops = 3;
}

message Hop {
  string service = 1;
  string trace = 2;
  string error = 3;
  repeated Hop hops = 4;
}
