syntax = "proto3";

package mesh.svc.v1;

option go_package = "mall/service_mesh_example/api/svc/v1;svcv1";

// gRPC 路径由包名和服务名决定。
// SvcA 的方法路径是 /mesh.svc.v1.SvcA/Call，网关按这个前缀转发。
service SvcA {
  rpc Ping(PingRequest) returns (PingReply);
  rpc Call(CallRequest) returns (CallReply);
}

service SvcB {
  rpc Ping(PingRequest) returns (PingReply);
  rpc Call(CallRequest) returns (CallReply);
}

service SvcC {
  rpc Ping(PingRequest) returns (PingReply);
  rpc Call(CallRequest) returns (CallReply);
}

message PingRequest {
  string trace = 1;
}

message PingReply {
  string service = 1;
  string trace = 2;
}

message CallRequest {
  string trace = 1;
  repeated string targets = 2;
  int32 depth = 3;
}

message CallReply {
  string service = 1;
  string trace = 2;
  repeated Hop hops = 3;
}

message Hop {
  string service = 1;
  string trace = 2;
  string error = 3;
  repeated Hop hops = 4;
}
